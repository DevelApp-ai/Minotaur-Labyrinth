# Language-neutral rules: hardcoded secrets in config/data files.
# Patterns are snippets of the generic data grammars (json, xml) that are
# Labyrinth target grammars in Minotaur-Grammars, so these rules apply to any
# project containing such files, regardless of the application language.
rules:
  - id: common-json-hardcoded-password
    severity: ERROR
    message: "Hardcoded password in a JSON config file; move secrets to a secret store."
    type: search
    pattern: '{ "password": $SECRET }'
  - id: common-json-hardcoded-api-key
    severity: ERROR
    message: "Hardcoded API key in a JSON config file; move secrets to a secret store."
    type: search
    pattern: '{ "api_key": $SECRET }'
  - id: common-json-hardcoded-secret
    severity: WARNING
    message: "Hardcoded secret in a JSON config file; move secrets to a secret store."
    type: search
    pattern: '{ "secret": $SECRET }'
  - id: common-xml-hardcoded-password
    severity: ERROR
    message: "Hardcoded password in an XML config file; move secrets to a secret store."
    type: search
    pattern: '<password>$SECRET</password>'
