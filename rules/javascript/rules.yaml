# JavaScript (JavaScript grammar + Labyrinth.extension overlay) SAST rules.
rules:
  - id: js-xss-innerhtml
    severity: ERROR
    message: "Untrusted request data is assigned to innerHTML; use textContent or escape the data."
    type: taint
    sources:
      - pattern: "req.query[$DATA]"
      - pattern: "req.body[$DATA]"
      - pattern: "location.hash"
    sinks:
      - pattern: "$EL.innerHTML = $HTML"
      - pattern: "document.write($HTML)"
    propagators:
      - pattern: "$HTML = $DATA"
        from: $DATA
        to: $HTML
      - pattern: "$HTML = $PREFIX + $DATA"
        from: $DATA
        to: $HTML
    sanitizers:
      - pattern: "$EL.textContent = $HTML"
  - id: js-command-injection
    severity: ERROR
    message: "Shell command is built from untrusted request data; avoid exec with user input."
    type: taint
    sources:
      - pattern: "req.query[$DATA]"
      - pattern: "req.body[$DATA]"
    sinks:
      - pattern: "exec($CMD)"
      - pattern: "execSync($CMD)"
    propagators:
      - pattern: "$CMD = $DATA"
        from: $DATA
        to: $CMD
      - pattern: "$CMD = $TMPL + $DATA"
        from: $DATA
        to: $CMD
  - id: js-sql-injection
    severity: ERROR
    message: "SQL query is built from untrusted request data; use parameterized queries instead."
    type: taint
    sources:
      - pattern: "req.query[$DATA]"
      - pattern: "req.body[$DATA]"
    sinks:
      - pattern: "db.query($SQL)"
      - pattern: "pool.query($SQL)"
    propagators:
      - pattern: "$SQL = $DATA"
        from: $DATA
        to: $SQL
      - pattern: "$SQL = $PREFIX + $DATA"
        from: $DATA
        to: $SQL
  - id: js-eval
    severity: ERROR
    message: "eval() on untrusted input can execute arbitrary code."
    type: search
    pattern: "eval($X)"
