name: run-corpus

# Engine-level corpus run via Minotaur.Cli (`labyrinth verify-corpus`).
# Signal run against the engine bump branch (Minotaur#275: StepLexer/StepParser
# 1.91.0 -> 1.100.1; upstream-verified fix for the exploratory-path hang, see
# ENFAStepLexer-StepParser#176). Once #275 merges this switches to ref: main and
# becomes a required check (tracked in #3 / tracker #9). Advisory until then.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DevelApp-ai/Minotaur
          ref: vibe/step-parser-bump-1-100-ab407c
          path: minotaur
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build minotaur/src/Minotaur.Cli/Minotaur.Cli.csproj --configuration Release
      - run: dotnet minotaur/src/Minotaur.Cli/bin/Release/net8.0/Minotaur.Cli.dll labyrinth verify-corpus --rules rules --tests tests
