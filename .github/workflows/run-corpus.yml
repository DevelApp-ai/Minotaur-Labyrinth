name: run-corpus

# Engine-level corpus run via Minotaur.Cli (`labyrinth verify-corpus`).
# Signal run against the engine bump branch (Minotaur#275: StepLexer/StepParser
# 1.91.0 -> 1.100.1; upstream-verified fix for the exploratory-path hang, see
# ENFAStepLexer-StepParser#176). Measured on 1.100.1 (run 45911936517): the run
# completes in ~30s (no more hang); 6/32 cases PASS, 26 FAIL — all FAILs are
# engine pattern-surface gaps (object literals, receiver-index, multi-token call
# args, `new`, chained calls, keyword args, `::` paths, blocks, xml content),
# tracked in Minotaur#278 (+ #276 for op:as tiling). Once #275 merges this
# switches to ref: main; it becomes a REQUIRED check once the #278 shapes land
# and the corpus is green (tracked in #3 / #5, tracker #9). Advisory until then.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DevelApp-ai/Minotaur
          ref: vibe/step-parser-bump-1-100-ab407c
          path: minotaur
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build minotaur/src/Minotaur.Cli/Minotaur.Cli.csproj --configuration Release
      - run: dotnet minotaur/src/Minotaur.Cli/bin/Release/net8.0/Minotaur.Cli.dll labyrinth verify-corpus --rules rules --tests tests
